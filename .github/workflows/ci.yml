name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart pydantic pydantic-settings \
            sqlalchemy python-jose bcrypt python-dotenv httpx requests \
            langchain-text-splitters langchain-core pypdf python-docx \
            pytest pytest-asyncio pytest-cov
      - name: Run tests
        env:
          OPENAI_API_KEY: ""
          N8N_ENABLED: "false"
          VECTOR_STORE: memory
          DEMO_AUTH_BYPASS: "true"
          RAG_SCORE_THRESHOLD: "0.15"
          SECRET_KEY: ci-test-secret
          APP_ENV: test
        run: pytest -q
